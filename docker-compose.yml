version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tfm2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tfm2
      POSTGRES_PASSWORD: tfm2_secret
      POSTGRES_DB: tfm2_ranking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: tfm2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    container_name: tfm2_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tfm2:tfm2_secret@postgres:5432/tfm2_ranking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_to_a_random_secret_key
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: tfm2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
